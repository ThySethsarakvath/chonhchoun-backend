version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chonhchoun_api
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chonhchoun_network

  redis:
    image: redis:7.2-alpine
    container_name: chonhchoun_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chonhchoun_network

volumes:
  redis_data:


networks:
  chonhchoun_network:
    driver: bridge
