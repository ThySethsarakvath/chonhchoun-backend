# Mosquitto MQTT Broker Configuration

# ── Listeners ────────────────────────────────────────────────────────────────
# Standard MQTT over TCP
listener 1883
protocol mqtt

# WebSocket listener — Flutter web and browser clients connect here
listener 9001
protocol websockets

# ── Security ─────────────────────────────────────────────────────────────────
# In development: allow anonymous connections
# In production: set allow_anonymous false and configure password_file
allow_anonymous true

# ── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information